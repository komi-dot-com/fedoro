# ==============================================================================
# FEDORO OS - Monitor & HiDPI Configuration
# ==============================================================================
# Syntax: monitor=NAME,RESOLUTION@REFRESH,OFFSET,SCALE

# Default fallback for any newly connected display
monitor = , preferred, auto, 1

# Examples for HiDPI and multi-monitor setups:
# 4K UHD with 1.5x fractional scaling:
# monitor = DP-1, 3840x2160@60, 0x0, 1.5

# High refresh rate gaming laptop display:
# monitor = eDP-1, 1920x1080@144, 0x0, 1

# Dual monitor layout (Laptop + External above or to the right):
# monitor = HDMI-A-1, 2560x1440@144, 1920x0, 1

# Unscale XWayland apps if fractional scaling is used
xwayland {
    force_zero_scaling = true
}
