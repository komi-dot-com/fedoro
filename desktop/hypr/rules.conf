# ==============================================================================
# FEDORO OS - Window Rules and Layer Rules
# ==============================================================================

# Floating rules for system utilities and dialogs
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(fedoro-welcome)$
windowrulev2 = center, class:^(fedoro-welcome)$
windowrulev2 = size 860 620, class:^(fedoro-welcome)$
windowrulev2 = float, class:^(fedoro-settings)$
windowrulev2 = center, class:^(fedoro-settings)$
windowrulev2 = size 920 680, class:^(fedoro-settings)$
windowrulev2 = float, class:^(fedoro-store)$
windowrulev2 = center, class:^(fedoro-store)$
windowrulev2 = size 1020 720, class:^(fedoro-store)$

# File chooser dialogs
windowrulev2 = float, title:^(Open File)(.*)$
windowrulev2 = float, title:^(Save File)(.*)$
windowrulev2 = float, title:^(Choose Files)(.*)$
windowrulev2 = float, title:^(All Files)(.*)$
windowrulev2 = float, class:^(xdg-desktop-portal)(.*)$

# Polkit authentication agent
windowrulev2 = float, class:^(polkit-gnome-authentication-agent-1)$
windowrulev2 = dimaround, class:^(polkit-gnome-authentication-agent-1)$

# Picture-in-Picture
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$

# Layer rules for Waybar and Rofi blur
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = blur, swaync-control-center
layerrule = ignorezero, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-notification-window
