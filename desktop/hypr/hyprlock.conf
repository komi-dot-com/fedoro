# ==============================================================================
# FEDORO OS - Hyprlock Modern Screen Lock
# ==============================================================================

background {
    monitor =
    path = /usr/share/backgrounds/fedoro/fedoro-default-dark.png
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time Display
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 80
    font_family = Inter, Segoe UI, sans-serif
    position = 0, 180
    halign = center
    valign = center
}

# Date Display
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(0, 242, 254, 0.85)
    font_size = 20
    font_family = Inter, Segoe UI, sans-serif
    position = 0, 100
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(0, 242, 254, 0.8)
    inner_color = rgba(12, 18, 30, 0.85)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <span foreground="##8899aa">Enter Password...</span>
    hide_input = false
    rounding = 25
    check_color = rgb(56, 239, 125)
    fail_color = rgb(255, 85, 85)
    fail_text = <i>Authentication Failed</i>
    fail_transition = 300
    position = 0, -40
    halign = center
    valign = center
}

# Fedoro Brand Tag
label {
    monitor =
    text = FEDORO OS • HYPRLAND
    color = rgba(255, 255, 255, 0.4)
    font_size = 12
    font_family = Inter, Segoe UI, sans-serif
    position = 0, 40
    halign = center
    valign = bottom
}
