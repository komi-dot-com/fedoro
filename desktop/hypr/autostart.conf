# ==============================================================================
# FEDORO OS - Autostart Daemons and Core Services
# ==============================================================================

# Core XDG Desktop Portal integration
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/libexec/xdg-desktop-portal-hyprland &
exec-once = /usr/libexec/xdg-desktop-portal &

# Authentication agent (Polkit)
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1 || /usr/lib/polkit-gnome-authentication-agent-1 &

# Desktop background / wallpaper
exec-once = hyprpaper || swaybg -i /usr/share/backgrounds/fedoro/fedoro-default-dark.png -m fill &

# Waybar top status bar
exec-once = waybar &

# Notification daemon (SwayNotificationCenter)
exec-once = swaync &

# Idle manager & screen lock
exec-once = hypridle &

# Network & Bluetooth tray applets
exec-once = nm-applet --indicator &
exec-once = blueman-applet &

# Audio stack (Wireplumber / PipeWire)
exec-once = gentoo-pipewire-launcher || true

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store &
exec-once = wl-paste --type image --watch cliphist store &

# First-boot Fedoro Welcome application
exec-once = if [ ! -f ~/.config/fedoro/.welcome_shown ]; then /usr/bin/fedoro-welcome & fi
