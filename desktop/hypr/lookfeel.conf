# ==============================================================================
# FEDORO OS - Appearance, Blur, Shadows & Animations
# ==============================================================================

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    
    # Fedoro Modern Gradient: Neon Cyan to Deep Sapphire Blue
    col.active_border = rgba(00f2feee) rgba(0052d4ee) 45deg
    col.inactive_border = rgba(1a2233aa)

    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 10

    active_opacity = 0.98
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(05070a88)
        color_inactive = rgba(00000044)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.01
        contrast = 0.9
        brightness = 0.9
        vibrancy = 0.2
        special = true
        popups = true
    }
}

animations {
    enabled = true

    # Smooth Bezier curves
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = windowDec, 0.16, 1, 0.3, 1

    animation = windows, 1, 4, windowDec, popin 80%
    animation = windowsOut, 1, 4, smoothIn, popin 80%
    animation = windowsMove, 1, 4, windowDec
    animation = border, 1, 8, default
    animation = borderangle, 1, 10, default
    animation = fade, 1, 3, smoothIn
    animation = workspaces, 1, 5, overshot, slide
    animation = specialWorkspace, 1, 4, windowDec, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
}
