<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%" fx="45%" fy="35%">
      <stop offset="0%" stop-color="#141c2b" />
      <stop offset="40%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#0052d4" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#11998e" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="logoEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0052d4" />
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <filter id="emblemGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Dark Slate Background -->
  <rect width="3840" height="2160" fill="url(#bgGlow)" />

  <!-- Ambient Light Orbs -->
  <circle cx="900" cy="800" r="600" fill="#0052d4" opacity="0.18" filter="url(#softBlur)" />
  <circle cx="2800" cy="1200" r="700" fill="#00f2fe" opacity="0.12" filter="url(#softBlur)" />
  <circle cx="1920" cy="1080" r="500" fill="#11998e" opacity="0.08" filter="url(#softBlur)" />

  <!-- Flowing Geometric Waves -->
  <path d="M-200 1400 Q 800 600, 1920 1200 T 4100 800 L 4100 2300 L -200 2300 Z" fill="url(#waveGrad1)" />
  <path d="M-200 1600 Q 1100 900, 2200 1500 T 4100 1100 L 4100 2300 L -200 2300 Z" fill="url(#waveGrad2)" />
  <path d="M-200 1850 Q 1400 1200, 2500 1700 T 4100 1450 L 4100 2300 L -200 2300 Z" fill="#080c14" opacity="0.85" />

  <!-- Center Watermark Logo Motif -->
  <g transform="translate(1620, 740) scale(1.2)" filter="url(#emblemGlow)" opacity="0.95">
    <rect x="32" y="32" width="448" height="448" rx="112" fill="#0c121e" stroke="#1f2d42" stroke-width="4" opacity="0.7" />
    <path d="M168 128 C168 114.7 178.7 104 192 104 L336 104 C358.1 104 376 121.9 376 144 C376 166.1 358.1 184 336 184 L224 184 L224 232 L304 232 C326.1 232 344 249.9 344 272 C344 294.1 326.1 312 304 312 L224 312 L224 384 C224 397.3 213.3 408 200 408 C186.7 408 176 397.3 176 384 L176 144 C176 135.2 173.1 128 168 128 Z" fill="url(#logoEmblemGrad)" />
    <path d="M 280 184 C 340 184 384 228 384 288 C 384 348 340 392 280 392 C 248 392 220 378 200 356" fill="none" stroke="url(#logoEmblemGrad)" stroke-width="24" stroke-linecap="round" />
    <circle cx="344" cy="272" r="14" fill="#00f2fe" />
    <circle cx="336" cy="144" r="12" fill="#38ef7d" />
  </g>

  <!-- Fedoro Typography Subtlety -->
  <text x="1920" y="1480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="14" fill="#ffffff" opacity="0.75">FEDORO OS</text>
  <text x="1920" y="1525" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="6" fill="#00f2fe" opacity="0.6">WAYLAND • HYPRLAND • FLATPAK</text>
</svg>
