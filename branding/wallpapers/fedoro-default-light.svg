<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <radialGradient id="bgGlowLight" cx="50%" cy="45%" r="75%" fx="45%" fy="35%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0f4f8" />
      <stop offset="100%" stop-color="#d9e2ec" />
    </radialGradient>

    <linearGradient id="waveGradLight1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052d4" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="waveGradLight2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.10" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#11998e" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="logoEmblemGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c0f0" />
      <stop offset="50%" stop-color="#2a75d3" />
      <stop offset="100%" stop-color="#1b3b82" />
    </linearGradient>

    <filter id="softBlurLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
  </defs>

  <!-- Clean Light Background -->
  <rect width="3840" height="2160" fill="url(#bgGlowLight)" />

  <!-- Ambient Light Orbs -->
  <circle cx="800" cy="700" r="600" fill="#4facfe" opacity="0.15" filter="url(#softBlurLight)" />
  <circle cx="2900" cy="1100" r="700" fill="#00f2fe" opacity="0.12" filter="url(#softBlurLight)" />

  <!-- Flowing Geometric Waves -->
  <path d="M-200 1350 Q 800 650, 1920 1250 T 4100 850 L 4100 2300 L -200 2300 Z" fill="url(#waveGradLight1)" />
  <path d="M-200 1600 Q 1100 950, 2200 1550 T 4100 1150 L 4100 2300 L -200 2300 Z" fill="url(#waveGradLight2)" />
  <path d="M-200 1850 Q 1400 1300, 2500 1750 T 4100 1500 L 4100 2300 L -200 2300 Z" fill="#e2e8f0" opacity="0.8" />

  <!-- Center Watermark Logo Motif -->
  <g transform="translate(1620, 740) scale(1.2)" opacity="0.95">
    <rect x="32" y="32" width="448" height="448" rx="112" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" opacity="0.9" />
    <path d="M168 128 C168 114.7 178.7 104 192 104 L336 104 C358.1 104 376 121.9 376 144 C376 166.1 358.1 184 336 184 L224 184 L224 232 L304 232 C326.1 232 344 249.9 344 272 C344 294.1 326.1 312 304 312 L224 312 L224 384 C224 397.3 213.3 408 200 408 C186.7 408 176 397.3 176 384 L176 144 C176 135.2 173.1 128 168 128 Z" fill="url(#logoEmblemGradLight)" />
    <path d="M 280 184 C 340 184 384 228 384 288 C 384 348 340 392 280 392 C 248 392 220 378 200 356" fill="none" stroke="url(#logoEmblemGradLight)" stroke-width="24" stroke-linecap="round" />
    <circle cx="344" cy="272" r="14" fill="#00c0f0" />
    <circle cx="336" cy="144" r="12" fill="#11998e" />
  </g>

  <!-- Fedoro Typography -->
  <text x="1920" y="1480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="14" fill="#1e293b" opacity="0.85">FEDORO OS</text>
  <text x="1920" y="1525" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="16" font-weight="500" letter-spacing="6" fill="#0284c7" opacity="0.75">WAYLAND • HYPRLAND • FLATPAK</text>
</svg>
